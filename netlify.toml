# ===== Performance + security headers =====
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/badges/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/ecz-lead.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ===== Never serve source files from the public folder =====
[[redirects]]
  from = "/server.cjs*"
  to = "/404"
  status = 404
  force = true

# ===== Ads landing page: /lp/shopify-development-services (static files, served before the SPA catch-all) =====

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
