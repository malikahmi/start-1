# Static deploy: this folder already contains the built site, so there is no build step.
[build]
  publish = "."

[context.production.environment]
  VITE_SITE_URL = "https://eceez.com"

[context.deploy-preview.environment]
  VITE_SITE_URL = "https://eceez.com"

[context.branch-deploy.environment]
  VITE_SITE_URL = "https://eceez.com"


# ===== Legacy WordPress URL redirects (must precede SPA catch-all) =====
[[redirects]]
  from = "/build-a-scalable-e-commerce-business/*"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/category/*"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/author/*"
  to = "/about-us"
  status = 301
  force = true

[[redirects]]
  from = "/wp-content/*"
  to = "/"
  status = 301
  force = true

